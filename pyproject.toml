[project]
name = "rl-robotics-journey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PiotrLubonski", email = "nyy9ftgs54@privaterelay.appleid.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium-robotics>=1.4.2",
    "gymnasium[box2d,classic-control,mujoco,toy-text]>=1.3.0",
    "mujoco>=3.14.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "stable-baselines3[extra]>=2.3.0",
]

[project.scripts]
rl-robotics-journey = "rl_robotics_journey:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_journey"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
