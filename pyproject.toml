[project]
name = "rl-robotics-journey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PiotrLubonski", email = "nyy9ftgs54@privaterelay.appleid.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium-robotics>=1.4.2",
    "gymnasium[box2d,classic-control,mujoco,toy-text]>=1.3.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "stable-baselines3[extra]>=2.3.0",
]

[project.scripts]
rl-robotics-journey = "rl_robotics_journey:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "experiments/week06", "experiments/week07"]
testpaths = ["tests"]
